<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumora</title>
<script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
<style>
:root{--bg:#F5F0FF;--card:#FFFFFF;--text:#4A4063}
:root.dark{--bg:#1E1B2E;--card:#2A2640;--text:#E8D5F5}
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:390px;max-width:100vw;margin:0 auto;height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#E8D5F5,#C3A6E8,#A8D8EA,#D4F0F0);
  background-size:400% 400%;
  animation:gradientMove 8s ease infinite;
  font-family:'Segoe UI',system-ui,sans-serif;
}
@keyframes gradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.splash-container{
  display:flex;flex-direction:column;align-items:center;
  opacity:0;animation:fadeSlideIn 1.5s ease forwards;
}
.splash-logo{
  width:200px;height:200px;object-fit:contain;
  opacity:0;animation:fadeIn 1.5s ease 0.3s forwards;
  filter:drop-shadow(0 4px 20px rgba(255,255,255,0.5));
}
.splash-title{
  font-size:36px;font-weight:700;color:white;margin-top:16px;
  text-shadow:0 2px 12px rgba(74,64,99,0.3);
  opacity:0;animation:fadeSlideUp 1s ease 0.8s forwards;
}
.splash-tagline{
  font-size:16px;color:white;opacity:0;margin-top:8px;
  text-shadow:0 1px 8px rgba(74,64,99,0.2);
  animation:fadeSlideUp 1s ease 1.3s forwards;
}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes fadeSlideUp{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideIn{0%{opacity:0}100%{opacity:1}}
.fade-out{animation:fadeOut 0.8s ease forwards}
@keyframes fadeOut{0%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="splash-container" id="splashContainer">
  <img src="logo.png" alt="Lumora" class="splash-logo">
  <div class="splash-title">Lumora</div>
  <div class="splash-tagline">your cozy space ✨</div>
</div>
<script>
setTimeout(()=>{
  document.getElementById('splashContainer').classList.add('fade-out');
  setTimeout(()=>{
    const base = document.querySelector('base')?.href || '';
    window.location.href='login.html';
  },800);
},3000);
</script>
</body>
</html>
