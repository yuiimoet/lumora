<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumora - Settings</title>
<script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
<style>
:root{--bg:#F5F0FF;--card:#FFFFFF;--text:#4A4063}
:root.dark{--bg:#1E1B2E;--card:#2A2640;--text:#E8D5F5}
*{margin:0;padding:0;box-sizing:border-box}
body{width:390px;max-width:100vw;margin:0 auto;min-height:100vh;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);padding-bottom:40px}
.header{padding:20px;display:flex;align-items:center;gap:12px}
.back-btn{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text);text-decoration:none}
.header h1{font-size:22px;font-weight:700}
.card{background:var(--card);border-radius:16px;margin:0 20px 16px;overflow:hidden;box-shadow:0 2px 8px rgba(195,166,232,0.1)}
.card-title{padding:16px 20px 0;font-size:14px;font-weight:600;opacity:0.5;text-transform:uppercase;letter-spacing:0.5px}
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid rgba(195,166,232,0.1)}
.setting-item:last-child{border-bottom:none}
.setting-left{display:flex;align-items:center;gap:12px;font-size:15px}
.setting-left .icon{font-size:20px}
.toggle{width:52px;height:28px;border-radius:14px;background:rgba(195,166,232,0.3);position:relative;cursor:pointer;transition:background 0.3s;border:none}
.toggle.on{background:#C3A6E8}
.toggle::after{content:'';width:24px;height:24px;border-radius:50%;background:white;position:absolute;top:2px;left:2px;transition:left 0.3s}
.toggle.on::after{left:26px}
select{padding:8px 12px;border:2px solid rgba(195,166,232,0.3);border-radius:10px;font-size:14px;background:var(--bg);color:var(--text);outline:none;cursor:pointer}
.btn-danger{display:block;width:calc(100% - 40px);margin:0 auto 16px;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:600;color:white;background:#e74c3c;cursor:pointer;text-align:center}
.btn-clear{background:rgba(195,166,232,0.2);color:var(--text)}
.about-section{text-align:center;padding:16px 20px}
.about-section .version{font-size:13px;opacity:0.6;margin-bottom:4px}
.about-section .made{font-size:13px;opacity:0.6}
.about-section .app-desc{font-size:14px;margin-top:8px;opacity:0.8}
.about-section img{width:60px;height:60px;margin:12px auto;display:block;object-fit:contain}
.confirm-popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center}
.confirm-popup.show{display:flex}
.confirm-box{background:var(--card);border-radius:20px;padding:24px;width:300px;text-align:center}
.confirm-box p{margin-bottom:20px;font-size:15px}
.confirm-btns{display:flex;gap:12px}
.confirm-btns button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.btn-confirm-red{background:#e74c3c;color:white}
.btn-cancel-grey{background:rgba(195,166,232,0.2);color:var(--text)}
</style>
</head>
<body>
<div class="header">
  <a href="index.html" class="back-btn">←</a>
  <h1 id="pageTitle"></h1>
</div>

<div class="card">
  <div class="card-title" id="appearanceTitle"></div>
  <div class="setting-item">
    <div class="setting-left"><span class="icon">🌙</span><span id="darkLabel"></span></div>
    <button class="toggle" id="darkToggle" onclick="toggleDark()"></button>
  </div>
</div>

<div class="card">
  <div class="card-title" id="langTitle"></div>
  <div class="setting-item">
    <div class="setting-left"><span class="icon">🌐</span><span id="langLabel"></span></div>
    <select id="langSelect" onchange="changeLang()">
      <option value="id">Bahasa Indonesia</option>
      <option value="en">English</option>
    </select>
  </div>
</div>

<div class="card">
  <div class="card-title" id="dataTitle"></div>
  <div class="setting-item" onclick="showClearConfirm()" style="cursor:pointer">
    <div class="setting-left"><span class="icon">🗑️</span><span id="clearLabel"></span></div>
    <span style="opacity:0.4">›</span>
  </div>
</div>

<div class="card">
  <div class="card-title" id="aboutTitle"></div>
  <div class="about-section">
    <img src="logo.png" alt="Lumora">
    <div class="version">Version 1.0.0</div>
    <div class="made" id="madeBy"></div>
    <div class="app-desc" id="appDesc"></div>
  </div>
</div>

<button class="btn-danger" id="btnLogout" onclick="showLogoutConfirm()"></button>

<div class="confirm-popup" id="clearPopup">
  <div class="confirm-box">
    <p id="clearMsg"></p>
    <div class="confirm-btns">
      <button class="btn-cancel-grey" onclick="hideClearConfirm()" id="clearCancel"></button>
      <button class="btn-confirm-red" onclick="clearAllData()" id="clearConfirm"></button>
    </div>
  </div>
</div>

<div class="confirm-popup" id="logoutPopup">
  <div class="confirm-box">
    <p id="logoutMsg"></p>
    <div class="confirm-btns">
      <button class="btn-cancel-grey" onclick="hideLogoutConfirm()" id="logoutCancel"></button>
      <button class="btn-confirm-red" onclick="doLogout()" id="logoutConfirm"></button>
    </div>
  </div>
</div>

<script>
const T={
  id:{title:'Pengaturan ⚙️',appearance:'Tampilan',dark:'Mode Gelap',language:'Bahasa',langLabel:'Bahasa',
    data:'Data & Privasi',clear:'Hapus Semua Data',about:'Tentang',
    madeBy:'Made with 💜 by Retinora inc',appDesc:'Lumora - Teman belajar nyamanmu',
    logout:'Keluar',clearMsg:'Yakin ingin menghapus semua data? Tindakan ini tidak bisa dibatalkan.',
    logoutMsg:'Yakin ingin keluar?',cancel:'Batal',confirm:'Ya, Hapus',confirmLogout:'Ya, Keluar'},
  en:{title:'Settings ⚙️',appearance:'Appearance',dark:'Dark Mode',language:'Language',langLabel:'Language',
    data:'Data & Privacy',clear:'Clear All Data',about:'About',
    madeBy:'Made with 💜 by Retinora inc',appDesc:'Lumora - Your cozy study companion',
    logout:'Logout',clearMsg:'Are you sure you want to clear all data? This cannot be undone.',
    logoutMsg:'Are you sure you want to logout?',cancel:'Cancel',confirm:'Yes, Clear',confirmLogout:'Yes, Logout'}
};
let lang=localStorage.getItem('lang')||'id';
let t=T[lang]||T.id;

function applyLang(){
  t=T[lang]||T.id;
  document.getElementById('pageTitle').textContent=t.title;
  document.getElementById('appearanceTitle').textContent=t.appearance;
  document.getElementById('darkLabel').textContent=t.dark;
  document.getElementById('langTitle').textContent=t.language;
  document.getElementById('langLabel').textContent=t.langLabel;
  document.getElementById('dataTitle').textContent=t.data;
  document.getElementById('clearLabel').textContent=t.clear;
  document.getElementById('aboutTitle').textContent=t.about;
  document.getElementById('madeBy').textContent=t.madeBy;
  document.getElementById('appDesc').textContent=t.appDesc;
  document.getElementById('btnLogout').textContent=t.logout;
  document.getElementById('clearMsg').textContent=t.clearMsg;
  document.getElementById('logoutMsg').textContent=t.logoutMsg;
  document.getElementById('clearCancel').textContent=t.cancel;
  document.getElementById('clearConfirm').textContent=t.confirm;
  document.getElementById('logoutCancel').textContent=t.cancel;
  document.getElementById('logoutConfirm').textContent=t.confirmLogout;
}

const isDark=document.documentElement.classList.contains('dark');
document.getElementById('darkToggle').className='toggle'+(isDark?' on':'');
document.getElementById('langSelect').value=lang;

function toggleDark(){
  document.documentElement.classList.toggle('dark');
  const on=document.documentElement.classList.contains('dark');
  localStorage.setItem('theme',on?'dark':'light');
  document.getElementById('darkToggle').className='toggle'+(on?' on':'');
}

function changeLang(){
  lang=document.getElementById('langSelect').value;
  localStorage.setItem('lang',lang);
  applyLang();
}

function showClearConfirm(){document.getElementById('clearPopup').classList.add('show')}
function hideClearConfirm(){document.getElementById('clearPopup').classList.remove('show')}
function showLogoutConfirm(){document.getElementById('logoutPopup').classList.add('show')}
function hideLogoutConfirm(){document.getElementById('logoutPopup').classList.remove('show')}

function clearAllData(){
  const keys=['lumora_tasks','lumora_sessions','lumora_folders','lumora_chat','lumora_flashcards','reminders','focus_active','focus_duration','focus_end_time'];
  keys.forEach(k=>localStorage.removeItem(k));
  hideClearConfirm();
  window.location.reload();
}

function doLogout(){
  localStorage.removeItem('lumora_auth');
  window.location.href='login.html';
}

applyLang();
</script>
</body>
</html>
