<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumora - Login</title>
<script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
<style>
:root{--bg:#F5F0FF;--card:#FFFFFF;--text:#4A4063}
:root.dark{--bg:#1E1B2E;--card:#2A2640;--text:#E8D5F5}
*{margin:0;padding:0;box-sizing:border-box}
body{width:390px;max-width:100vw;margin:0 auto;min-height:100vh;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:40px 24px}
.logo-section{text-align:center;margin-bottom:32px}
.logo-img{width:120px;height:120px;object-fit:contain;margin-bottom:12px}
.logo-title{font-size:28px;font-weight:700;color:var(--text)}
.logo-moon{font-size:28px}
.tagline{font-size:14px;color:var(--text);opacity:0.7;margin-top:4px}
.form-card{background:var(--card);border-radius:20px;padding:24px;width:100%;box-shadow:0 4px 20px rgba(195,166,232,0.15)}
.form-title{font-size:20px;font-weight:600;margin-bottom:20px;text-align:center;color:var(--text)}
.input-group{margin-bottom:16px;position:relative}
.input-group label{display:block;font-size:13px;margin-bottom:6px;color:var(--text);opacity:0.8}
.input-group input{width:100%;padding:12px 16px;border:2px solid rgba(195,166,232,0.3);border-radius:12px;font-size:15px;background:var(--bg);color:var(--text);outline:none;transition:border-color 0.3s}
.input-group input:focus{border-color:#C3A6E8}
.toggle-pw{position:absolute;right:12px;top:32px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--text);opacity:0.6}
.forgot{text-align:right;margin-top:-8px;margin-bottom:16px}
.forgot a{font-size:13px;color:#C3A6E8;text-decoration:none}
.btn-primary{width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:600;color:white;background:linear-gradient(135deg,#C3A6E8,#A8D8EA);cursor:pointer;transition:transform 0.2s,box-shadow 0.2s}
.btn-primary:active{transform:scale(0.98)}
.switch-text{text-align:center;margin-top:20px;font-size:14px;color:var(--text);opacity:0.7}
.switch-text a{color:#C3A6E8;text-decoration:none;font-weight:600}
.error-msg{background:#ffe0e0;color:#c0392b;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none;text-align:center}
.success-msg{background:#e0ffe0;color:#27ae60;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none;text-align:center}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#27ae60;color:white;padding:12px 24px;border-radius:12px;font-size:14px;z-index:999;opacity:0;transition:opacity 0.3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="logo-section">
  <img src="logo.png" alt="Lumora" class="logo-img">
  <div class="logo-title">Lumora <span class="logo-moon">🌙</span></div>
  <div class="tagline" id="tagline"></div>
</div>
<div class="form-card">
  <div class="form-title" id="formTitle"></div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>
  <div id="loginForm">
    <div class="input-group">
      <label id="lbl_email"></label>
      <input type="email" id="loginEmail" placeholder="email@example.com">
    </div>
    <div class="input-group">
      <label id="lbl_password"></label>
      <input type="password" id="loginPassword" placeholder="••••••••">
      <button class="toggle-pw" onclick="togglePw('loginPassword',this)">👁️</button>
    </div>
    <div class="forgot"><a href="#" id="forgotLink"></a></div>
    <button class="btn-primary" id="btnLogin" onclick="doLogin()"></button>
    <div class="switch-text"><span id="noAccount"></span> <a href="#" onclick="showRegister()" id="registerLink"></a></div>
  </div>
  <div id="registerForm" style="display:none">
    <div class="input-group">
      <label id="lbl_name"></label>
      <input type="text" id="regName" placeholder="">
    </div>
    <div class="input-group">
      <label id="lbl_reg_email"></label>
      <input type="email" id="regEmail" placeholder="email@example.com">
    </div>
    <div class="input-group">
      <label id="lbl_reg_pw"></label>
      <input type="password" id="regPassword" placeholder="••••••••">
      <button class="toggle-pw" onclick="togglePw('regPassword',this)">👁️</button>
    </div>
    <div class="input-group">
      <label id="lbl_confirm_pw"></label>
      <input type="password" id="regConfirm" placeholder="••••••••">
      <button class="toggle-pw" onclick="togglePw('regConfirm',this)">👁️</button>
    </div>
    <button class="btn-primary" id="btnRegister" onclick="doRegister()"></button>
    <div class="switch-text"><span id="haveAccount"></span> <a href="#" onclick="showLogin()" id="loginLink"></a></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const T={
  id:{
    tagline:'Tempat nyamanmu untuk menyelesaikan tugas 🌙',
    login:'Masuk',register:'Daftar',email:'Email',password:'Kata Sandi',name:'Nama',
    confirmPw:'Konfirmasi Kata Sandi',forgot:'Lupa kata sandi?',
    noAccount:'Belum punya akun?',haveAccount:'Sudah punya akun?',
    registerLink:'Daftar',loginLink:'Masuk',
    errEmpty:'Harap isi semua kolom',errEmail:'Email tidak ditemukan',errPw:'Kata sandi salah',
    errMatch:'Kata sandi tidak cocok',errExist:'Email sudah terdaftar',
    successReg:'Pendaftaran berhasil! 🎉',namePh:'Nama lengkap'
  },
  en:{
    tagline:'Your cozy space to get things done 🌙',
    login:'Login',register:'Register',email:'Email',password:'Password',name:'Name',
    confirmPw:'Confirm Password',forgot:'Forgot password?',
    noAccount:"Don't have an account?",haveAccount:'Already have an account?',
    registerLink:'Register',loginLink:'Login',
    errEmpty:'Please fill all fields',errEmail:'Email not found',errPw:'Wrong password',
    errMatch:'Passwords do not match',errExist:'Email already registered',
    successReg:'Registration successful! 🎉',namePh:'Full name'
  }
};
const lang=localStorage.getItem('lang')||'id';
const t=T[lang]||T.id;

function applyLang(){
  document.getElementById('tagline').textContent=t.tagline;
  document.getElementById('formTitle').textContent=t.login;
  document.getElementById('lbl_email').textContent=t.email;
  document.getElementById('lbl_password').textContent=t.password;
  document.getElementById('forgotLink').textContent=t.forgot;
  document.getElementById('btnLogin').textContent=t.login;
  document.getElementById('noAccount').textContent=t.noAccount;
  document.getElementById('registerLink').textContent=t.registerLink;
  document.getElementById('lbl_name').textContent=t.name;
  document.getElementById('lbl_reg_email').textContent=t.email;
  document.getElementById('lbl_reg_pw').textContent=t.password;
  document.getElementById('lbl_confirm_pw').textContent=t.confirmPw;
  document.getElementById('btnRegister').textContent=t.register;
  document.getElementById('haveAccount').textContent=t.haveAccount;
  document.getElementById('loginLink').textContent=t.loginLink;
  document.getElementById('regName').placeholder=t.namePh;
}
applyLang();

function togglePw(id,btn){const i=document.getElementById(id);if(i.type==='password'){i.type='text';btn.textContent='🙈'}else{i.type='password';btn.textContent='👁️'}}
function showError(msg){const e=document.getElementById('errorMsg');e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function showSuccess(msg){const e=document.getElementById('successMsg');e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

function showRegister(){
  document.getElementById('loginForm').style.display='none';
  document.getElementById('registerForm').style.display='block';
  document.getElementById('formTitle').textContent=t.register;
  document.getElementById('errorMsg').style.display='none';
}
function showLogin(){
  document.getElementById('registerForm').style.display='none';
  document.getElementById('loginForm').style.display='block';
  document.getElementById('formTitle').textContent=t.login;
  document.getElementById('errorMsg').style.display='none';
}

function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pw=document.getElementById('loginPassword').value;
  if(!email||!pw)return showError(t.errEmpty);
  const users=JSON.parse(localStorage.getItem('lumora_users')||'[]');
  const user=users.find(u=>u.email===email);
  if(!user)return showError(t.errEmail);
  if(user.password!==pw)return showError(t.errPw);
  localStorage.setItem('lumora_auth',JSON.stringify(user));
  window.location.href='index.html';
}

function doRegister(){
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pw=document.getElementById('regPassword').value;
  const confirm=document.getElementById('regConfirm').value;
  if(!name||!email||!pw||!confirm)return showError(t.errEmpty);
  if(pw!==confirm)return showError(t.errMatch);
  const users=JSON.parse(localStorage.getItem('lumora_users')||'[]');
  if(users.find(u=>u.email===email))return showError(t.errExist);
  const user={name,email,password:pw,username:'@'+name.toLowerCase().replace(/\s/g,''),bio:'',dob:'',dailyTarget:'2',photo:'',joinDate:new Date().toISOString()};
  users.push(user);
  localStorage.setItem('lumora_users',JSON.stringify(users));
  localStorage.setItem('lumora_auth',JSON.stringify(user));
  showToast(t.successReg);
  setTimeout(()=>window.location.href='index.html',1000);
}

if(localStorage.getItem('lumora_auth')){window.location.href='index.html'}
</script>
</body>
</html>
